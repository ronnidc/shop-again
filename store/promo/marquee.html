<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Marquee promotional tile</title>
    <!-- Rendered at 1400 by 560 by screenshots.mjs, which fills in the placeholders. -->
    <style>
      @font-face {
        font-family: Poppins;
        font-weight: 400;
        src: url('{{fonts}}/Poppins-Regular.ttf');
      }
      html,
      body {
        margin: 0;
      }
      /* The brand's two colors and nothing else: the stores ask for saturated
         color, little text and branding that matches the icon. */
      body {
        display: flex;
        align-items: center;
        gap: 48px;
        inline-size: 1400px;
        block-size: 560px;
        box-sizing: border-box;
        padding-inline: 120px;
        overflow: hidden;
        background: #1e2a64;
        color: #fff;
        font-family: Poppins, sans-serif;
      }
      /* The icon brings its own white square with 8 of 128 air around it, so
         320 shows a 280 tile. */
      .icon {
        flex: none;
        inline-size: 320px;
        block-size: 320px;
      }
      .name {
        display: block;
        block-size: 88px;
      }
      p {
        margin-block: 22px 0;
        margin-inline: 0;
        max-inline-size: 780px;
        font-size: 30px;
        line-height: 1.3;
        color: rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <img class="icon" src="{{root}}/assets/icon.svg" alt="" />
    <div>
      <img class="name" src="{{root}}/store/promo/name-white.svg" alt="Shop Again?" />
      <p>Note how an order went. A banner reminds you when you return.</p>
    </div>
  </body>
</html>
