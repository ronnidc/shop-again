<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Marquee promotional tile</title>
    <!-- Rendered at 1400 by 560 by screenshots.mjs. -->
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        gap: 72px;
        inline-size: 1400px;
        block-size: 560px;
        box-sizing: border-box;
        padding-inline: 140px;
        overflow: hidden;
        background: linear-gradient(135deg, #1f4fd1 0%, #3a6cf0 100%);
        color: #fff;
        font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
      }
      /* The icon brings its own white square, so it only needs a shadow. */
      .badge {
        flex: none;
        inline-size: 280px;
        block-size: 280px;
        border-radius: 61px;
        box-shadow: 0 32px 80px rgba(10, 30, 90, 0.35);
      }
      .badge img {
        display: block;
        inline-size: 280px;
        block-size: 280px;
      }
      h1 {
        margin: 0;
        font-size: 84px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }
      p {
        margin-block: 18px 0;
        margin-inline: 0;
        max-inline-size: 760px;
        font-size: 32px;
        line-height: 1.3;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="badge"><img src="../../assets/icon.svg" alt="" /></div>
    <div>
      <h1>Shop Again?</h1>
      <p>Note how an order went. The next time you open that shop, a banner reminds you.</p>
    </div>
  </body>
</html>
