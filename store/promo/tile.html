<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Small promotional tile</title>
    <!-- Rendered at 440 by 280 by screenshots.mjs. -->
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        gap: 28px;
        inline-size: 440px;
        block-size: 280px;
        box-sizing: border-box;
        padding-inline: 36px;
        overflow: hidden;
        background: linear-gradient(135deg, #1f4fd1 0%, #3a6cf0 100%);
        color: #fff;
        font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
      }
      .badge {
        display: grid;
        place-items: center;
        flex: none;
        inline-size: 120px;
        block-size: 120px;
        border-radius: 28px;
        background: #fff;
        box-shadow: 0 16px 40px rgba(10, 30, 90, 0.35);
      }
      .badge img {
        inline-size: 94px;
        block-size: 94px;
      }
      h1 {
        margin: 0;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }
      p {
        margin-block: 10px 0;
        margin-inline: 0;
        font-size: 16px;
        line-height: 1.3;
        opacity: 0.88;
      }
    </style>
  </head>
  <body>
    <div class="badge"><img src="../icon.svg" alt="" /></div>
    <div>
      <h1>Shop Again?</h1>
      <p>Your own notes on web shops, shown when you come back.</p>
    </div>
  </body>
</html>
