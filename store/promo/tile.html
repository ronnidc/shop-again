<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Small promotional tile</title>
    <!-- Rendered at 440 by 280 by screenshots.mjs, which fills in the placeholders. -->
    <style>
      html,
      body {
        margin: 0;
      }
      /* Icon and name only, stacked: the store shows this tile at half size in
         listings and prints the name and summary next to it anyway. */
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        inline-size: 440px;
        block-size: 280px;
        overflow: hidden;
        background: #1e2a64;
      }
      /* The icon brings its own white square with 8 of 128 air around it, so
         128 shows a 112 tile. */
      .icon {
        inline-size: 128px;
        block-size: 128px;
      }
      .name {
        display: block;
        block-size: 47px;
      }
    </style>
  </head>
  <body>
    <img class="icon" src="{{root}}/assets/icon.svg" alt="" />
    <img class="name" src="{{root}}/store/promo/name-white.svg" alt="Shop Again?" />
  </body>
</html>
