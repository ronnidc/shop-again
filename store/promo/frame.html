<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Screenshot frame</title>
    <!-- Filled in by screenshots.mjs and rendered at 1280 by 800. -->
    <style>
      @font-face {
        font-family: Poppins;
        font-weight: 400;
        src: url('{{fonts}}/Poppins-Regular.ttf');
      }
      @font-face {
        font-family: Poppins;
        font-weight: 600;
        src: url('{{fonts}}/Poppins-SemiBold.ttf');
      }
      html,
      body {
        margin: 0;
      }
      /* The light value of the tiles' navy, so icon, tiles and screenshots are
         one hue on the listing page. */
      body {
        position: relative;
        inline-size: 1280px;
        block-size: 800px;
        overflow: hidden;
        background: #e9ecf5;
        color: #1e2a64;
        font-family: Poppins, sans-serif;
      }
      header {
        padding-block: 44px 0;
        padding-inline: 64px;
      }
      h1 {
        margin: 0;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.15;
      }
      p {
        margin-block: 6px 0;
        margin-inline: 0;
        font-size: 22px;
        color: #525b86;
      }
      .shot {
        position: absolute;
        inset-block-start: 156px;
        inset-inline-start: 50%;
        translate: -50% 0;
        overflow: hidden;
        border-radius: 12px;
        background: #fff;
        box-shadow:
          0 1px 2px rgba(30, 42, 100, 0.12),
          0 20px 48px rgba(30, 42, 100, 0.18);
      }
      .shot img {
        display: block;
      }
      /* The popup is captured at twice its size and shown a fifth larger than
         life, so its text survives the store's half-size carousel. */
      .shot.popup img {
        inline-size: calc({{width}}px * 1.2);
      }
      /* A whole page is shown a little narrower than the frame, so its edges
         and shadow are visible, and fades out before the bottom instead of
         being cut mid-line. */
      .shot.page {
        inset-block-start: 150px;
        mask-image: linear-gradient(#000 470px, transparent 630px);
      }
      .shot.page img {
        inline-size: 1180px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>{{title}}</h1>
      <p>{{subtitle}}</p>
    </header>
    <div class="shot {{kind}}"><img src="{{image}}" alt="" /></div>
  </body>
</html>
