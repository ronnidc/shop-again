<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- A shopping bag asking the question in the name. Two colors and one bold
       shape, so it still reads in the toolbar at 16 pixels. The handle is a
       slot in the bag and not a loop above it: a loop on a body this small
       looks like a padlock. -->
