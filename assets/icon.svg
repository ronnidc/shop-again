<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The full mark: a circular arrow for "again" around a shopping bag with
       the question in it, in one dark blue. The white rounded square is part
       of the icon, so the blue never sits on a dark toolbar or a dark store
       page. The arrow keeps a white edge where it passes the bag. Used from
       48 pixels up, the toolbar sizes come from icon-small.svg. -->
  <rect width="128" height="128" rx="28" fill="#fff"/>
  <g transform="translate(64 64) scale(0.88) translate(-64 -64)">
    <path d="M52 52v-9a12 12 0 0 1 24 0v9" fill="none" stroke="#1e2a64" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M43 52h42a4 4 0 0 1 4 3.6l3 34a6 6 0 0 1-6 6.4H42a6 6 0 0 1-6-6.4l3-34a4 4 0 0 1 4-3.6z" fill="#1e2a64"/>
    <g transform="translate(64 74) scale(0.5) translate(-64 -90)">
      <path d="M50 76a14 14 0 1 1 20 12.6c-4.5 2.2-6 5-6 9.4" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="64" cy="110" r="6.5" fill="#fff"/>
    </g>
    <path d="M73.3 11.3A53.5 53.5 0 1 0 117.3 59.3A5.5 5.5 0 0 0 106.3 60.3A42.5 42.5 0 1 1 71.4 22.1L69.9 30.5L96.0 20.9L74.8 2.9Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
    <path d="M73.3 11.3A53.5 53.5 0 1 0 117.3 59.3A5.5 5.5 0 0 0 106.3 60.3A42.5 42.5 0 1 1 71.4 22.1L69.9 30.5L96.0 20.9L74.8 2.9Z" fill="#1e2a64"/>
